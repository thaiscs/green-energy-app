<%
# A MarketLocation (10-digit id) and MeteringLocation (33-char id) per new unit.
# Ids are drawn from a distinct 3-billion range so they never collide with the
# hand-written ones above.
(2..6).each do |b|
  (1..10).each do |n|
    seq = 3_000_000_000 + (b - 2) * 10 + n
%>
b<%= b %>_apartment_<%= n %>_market:
  unit: b<%= b %>_apartment_<%= n %>
  type: MarketLocation
  external_id: "<%= format("%010d", seq) %>"

b<%= b %>_apartment_<%= n %>_metering:
  unit: b<%= b %>_apartment_<%= n %>
  type: MeteringLocation
  external_id: "DE<%= format("%031d", seq) %>"
<% end %>
<% end %>
