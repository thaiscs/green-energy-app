<%
# 10 apartments for each of the 5 additional buildings (building_2 .. building_6).
surnames = %w[Schmidt Fischer Weber Meyer Wagner Becker Schulz Hoffmann Koch Richter
              Klein Wolf Neumann Braun Krüger Werner Schwarz Zimmermann Lang Krause]
(2..6).each do |b|
  (1..10).each do |n|
    initial = ("A".ord + ((b * 10 + n) % 26)).chr
    surname = surnames[(b * 10 + n) % surnames.length]
%>
b<%= b %>_apartment_<%= n %>:
  building: building_<%= b %>
  label: "<%= (n + 1) / 2 %><%= n.odd? ? "A" : "B" %>"
  resident_name: <%= initial %>. <%= surname %>
<% end %>
<% end %>
