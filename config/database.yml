default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: localhost
  username: postgres
  password: postgres

development:
  <<: *default
  database: greenenergy_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: greenenergy_test

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    <<: *default
    database: greenenergy_production
    username: greenenergy
    password: <%= ENV["GREENENERGY_DATABASE_PASSWORD"] %>
    host: <%= ENV["GREENENERGY_DATABASE_HOST"] %>
    statement_limit: 200
  cache:
    <<: *default
    database: greenenergy_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: greenenergy_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: greenenergy_production_cable
    migrations_paths: db/cable_migrate